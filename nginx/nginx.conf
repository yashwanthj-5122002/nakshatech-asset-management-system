# Rate-limit buckets live at http level on purpose: the stock nginx image
# includes this file from conf.d/*.conf, which is evaluated inside http {}.
# Two buckets - one for the credential endpoints (brute force / OTP farming),
# one for the rest of the API - keyed on the client address.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 100M;

    # Slowloris and stalled-transfer protection; a client that opens a
    # connection and dribbles bytes can otherwise hold a worker indefinitely.
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 15s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    limit_req_status 429;
    limit_req_log_level warn;

    # Headers the application does not set itself. The API additionally sends
    # X-Content-Type-Options, X-Frame-Options and Referrer-Policy from
    # app.main.production_headers, so they are not repeated here.
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;

    # Credential endpoints get their own, much smaller bucket. The application
    # enforces its own per-IP and per-account counters; this is the outer layer
    # that still applies if the app-level limiter is disabled or bypassed.
    location /api/auth/ {
        limit_req zone=api_auth burst=20 nodelay;

        proxy_pass http://backend:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        limit_req zone=api_general burst=100 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        # add_header is not inherited into a location that declares its own,
        # so the server-level headers are repeated here alongside the CSP.
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Local stack runs Vite's dev server, which needs inline module
        # scripts (React Refresh preamble) and eval, plus a websocket for HMR.
        # Production headers ship a stricter script-src from
        # frontend/public/.htaccess, where the bundle is built.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss: https://tile.openstreetmap.org https://cdn.jsdelivr.net https://raw.githubusercontent.com" always;

        proxy_pass http://frontend:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
