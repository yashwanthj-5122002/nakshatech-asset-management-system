# Apache (EA4) snippet for the native systemd backend.
#
# Do NOT replace global cPanel/Apache configuration. Install this only for the
# crm.nakshatech.com virtual host through the cPanel EA4 userdata include
# mechanism, for example:
#
#   sudo mkdir -p /etc/apache2/conf.d/userdata/std/2_4/crmnakshatech/crm.nakshatech.com
#   sudo cp deploy/apache/crm-api-proxy.conf \
#     /etc/apache2/conf.d/userdata/std/2_4/crmnakshatech/crm.nakshatech.com/api-proxy.conf
#   sudo /usr/local/cpanel/scripts/rebuildhttpdconf
#   sudo /usr/local/cpanel/scripts/restartsrv_httpd
#
# Preserve cPanel AutoSSL, the existing document root
# (/home/crmnakshatech/public_html) and all other virtual hosts.
# Requires mod_proxy and mod_proxy_http, enabled by the administrator.
<IfModule mod_proxy.c>
  <Location "/api/">
    ProxyPreserveHost On
    ProxyPass "http://127.0.0.1:8010/api/" retry=0 timeout=300
    ProxyPassReverse "http://127.0.0.1:8010/api/"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    # Documents and Excel downloads can be large; keep the 300s API timeout.
    ProxyTimeout 300
  </Location>
</IfModule>
