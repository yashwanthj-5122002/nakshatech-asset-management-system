# Nginx snippet for the native systemd backend.
#
# cPanel may front Apache with its own Nginx (or an administrator-managed Nginx).
# Do NOT replace the global nginx.conf. Include this file only inside the
# existing crm.nakshatech.com server block, before the generic location / block,
# exactly as the hosting administrator approves:
#
#   include /etc/nginx/snippets/crm-api-proxy.conf;
#
# If cPanel's Nginx already forwards everything to Apache, the Apache snippet in
# deploy/apache/crm-api-proxy.conf is the only change required.
location /api/ {
    proxy_pass http://127.0.0.1:8010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 15s;
    client_max_body_size 100M;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
