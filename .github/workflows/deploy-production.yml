name: Production deployment
# Native cPanel deployment: Python 3.12 virtual environment, systemd-managed
# Uvicorn (or the Passenger alternative), cPanel-managed PostgreSQL/Redis/MinIO
# and a statically published frontend. No Docker runs on the production server.
#
# The cPanel account holds three separate directories:
#   repository  /home/crmnakshatech/repositories/nakshatech-asset-management-system
#   backend     /home/crmnakshatech/crm_backend        (running Python app)
#   frontend    /home/crmnakshatech/public_html        (running React build)
# The running directories are copies, so this workflow deploys both of them from
# one validated commit. Updating the Git checkout alone never updates the app.
on:
  workflow_run:
    workflows: [ERP quality checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Previously verified release SHA to roll back to (leave empty for a normal deployment)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: nakshatech-production
  cancel-in-progress: false
env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '26.13.1'
jobs:
  prepare:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.rollback_sha == '')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.approve.outputs.sha }}
    steps:
      - name: Approve only the tested current main commit
        id: approve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const sha = main.data.commit.sha;
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.head_sha !== sha)
              throw new Error('Stale quality run. Only the current main commit may deploy.');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'quality.yml', branch: 'main', head_sha: sha, per_page: 100
            });
            const eligible = runs.filter(r =>
              r.head_sha === sha &&
              r.event === 'push' &&
              r.head_repository.full_name === context.repo.owner + '/' + context.repo.repo);
            eligible.sort((a, b) => b.id - a.id);
            if (!eligible.length || eligible[0].conclusion !== 'success')
              throw new Error('The latest push quality run for the exact main SHA must succeed.');
            core.setOutput('sha', sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.approve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile the frontend on GitHub Actions
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -d dist/assets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate deployment configuration offline
        run: |
          python -m pip install --quiet 'PyYAML>=6,<7'
          bash scripts/validate-production.sh
      - name: Package the exact reviewed release
        env:
          SHA: ${{ steps.approve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p release
          git archive "$SHA" backend scripts deploy cpanel | tar -x -C release
          # git archive only contains tracked sources, so the compiled frontend
          # is copied explicitly from the build produced in this job.
          cp -a frontend/dist release/frontend
          cp -p frontend/public/.htaccess release/frontend/.htaccess
          test -f release/frontend/index.html
          ls release/frontend/assets/*.js >/dev/null
          ls release/frontend/assets/*.css >/dev/null
          # Geographic data and branding images are served by the live site.
          test -d release/frontend/data
          ls release/frontend/data/* >/dev/null
          ls release/frontend/*.webp >/dev/null
          ls release/frontend/*.png >/dev/null
          # The production API base URL must be the same-origin /api prefix.
          grep -q "/api" release/frontend/assets/*.js
          bash scripts/validate-release-layout.sh "$PWD/release" "$SHA"
          # Public release marker, served over HTTPS after activation.
          printf '{"commit":"%s"}\n' "$SHA" > release/frontend/release-version.json
          test -f release/backend/requirements-cpanel.txt
          test -f release/scripts/deploy-production.sh
          test -f release/deploy/systemd/nakshatech-crm.service
          printf '%s\n' "$SHA" > release/RELEASE_SHA
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 14
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment: PRODUCTION
    steps:
      - name: Disabled gate
        if: vars.PRODUCTION_DEPLOY_ENABLED != 'true'
        run: echo "Production connection disabled. Release build and configuration validation completed."
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        with:
          name: production-release
      - name: Recheck main immediately before transfer
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const result = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (result.data.commit.sha !== process.env.SHA) throw new Error('Release became stale');
      - name: Validate deployment inputs
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
          PRODUCTION_FRONTEND_PATH: ${{ vars.PRODUCTION_FRONTEND_PATH || '/home/crmnakshatech/public_html' }}
          PRODUCTION_BACKEND_PATH: ${{ vars.PRODUCTION_BACKEND_PATH || '/home/crmnakshatech/crm_backend' }}
          PRODUCTION_REPOSITORY_PATH: ${{ vars.PRODUCTION_REPOSITORY_PATH || '/home/crmnakshatech/repositories/nakshatech-asset-management-system' }}
          APPROVED_SCHEMA_SHA: ${{ vars.APPROVED_SCHEMA_SHA }}
          APPROVE_EMPTY_INSTALL: ${{ vars.APPROVE_EMPTY_INSTALL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CPANEL_DEPLOY_PATH" == "/home/crmnakshatech" ]] || { echo "CPANEL_DEPLOY_PATH must be /home/crmnakshatech"; exit 1; }
          [[ "$CPANEL_USERNAME" == "crmnakshatech" ]] || { echo "CPANEL_USERNAME must be crmnakshatech"; exit 1; }
          [[ "$CPANEL_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid CPANEL_HOST"; exit 1; }
          [[ "$CPANEL_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid CPANEL_SSH_PORT"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release SHA"; exit 1; }
          for path in "$PRODUCTION_FRONTEND_PATH" "$PRODUCTION_BACKEND_PATH" "$PRODUCTION_REPOSITORY_PATH"; do
            [[ "$path" == /home/crmnakshatech/* ]] || { echo "Production path must live under /home/crmnakshatech: $path"; exit 1; }
            [[ "$path" != *".."* ]] || { echo "Production path must not contain '..': $path"; exit 1; }
            [[ "$path" != "/home/crmnakshatech/public_html"/* ]] || { echo "Application paths must never be inside public_html: $path"; exit 1; }
          done
          [[ "$PRODUCTION_BACKEND_PATH" != "$PRODUCTION_REPOSITORY_PATH" ]] || { echo "Backend and repository paths must differ"; exit 1; }
          [[ "$PRODUCTION_FRONTEND_PATH" != "$PRODUCTION_BACKEND_PATH" ]] || { echo "Frontend and backend paths must differ"; exit 1; }
          [[ "$PRODUCTION_FRONTEND_PATH" != "$PRODUCTION_REPOSITORY_PATH" ]] || { echo "Frontend and repository paths must differ"; exit 1; }
          # Schema approval is optional: the deploy script requires it only when
          # the release actually changes migrations or schema compatibility code.
          [[ -z "$APPROVED_SCHEMA_SHA" || "$APPROVED_SCHEMA_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "APPROVED_SCHEMA_SHA must be empty or a 40-character commit SHA"; exit 1; }
          [[ "${APPROVE_EMPTY_INSTALL:-false}" == "true" || "${APPROVE_EMPTY_INSTALL:-false}" == "false" ]] || { echo "APPROVE_EMPTY_INSTALL must be true or false"; exit 1; }
      - name: Transfer and activate the exact release natively
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          PRODUCTION_FRONTEND_PATH: ${{ vars.PRODUCTION_FRONTEND_PATH || '/home/crmnakshatech/public_html' }}
          PRODUCTION_BACKEND_PATH: ${{ vars.PRODUCTION_BACKEND_PATH || '/home/crmnakshatech/crm_backend' }}
          PRODUCTION_REPOSITORY_PATH: ${{ vars.PRODUCTION_REPOSITORY_PATH || '/home/crmnakshatech/repositories/nakshatech-asset-management-system' }}
          APPROVED_SCHEMA_SHA: ${{ vars.APPROVED_SCHEMA_SHA }}
          APPROVE_EMPTY_INSTALL: ${{ vars.APPROVE_EMPTY_INSTALL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          sha256sum -c release.tar.gz.sha256
          digest="$(cut -d' ' -f1 release.tar.gz.sha256)"
          target="$CPANEL_USERNAME@$CPANEL_HOST"
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT")
          rsync_rsh="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p $CPANEL_SSH_PORT"
          printf -v remote_preflight 'bash -s -- %q %q %q %q' \
            "$SHA" "$PRODUCTION_FRONTEND_PATH" "$PRODUCTION_BACKEND_PATH" "$PRODUCTION_REPOSITORY_PATH"
          # Release arguments are %q-quoted above before reaching ssh.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "$remote_preflight" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          frontend="$2"
          backend="$3"
          repository="$4"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOME" == "/home/crmnakshatech" ]] || { echo "Unexpected account home $HOME"; exit 1; }
          [[ ! -L "$HOME" ]]
          for path in "$frontend" "$backend" "$repository"; do
            [[ "$path" == /home/crmnakshatech/* ]] || { echo "Unapproved path $path"; exit 1; }
            [[ "$path" != *".."* ]] || { echo "Unapproved path $path"; exit 1; }
            [[ "$path" != /home/crmnakshatech/public_html* ]] || { echo "Path inside public_html: $path"; exit 1; }
            [[ -d "$path" && ! -L "$path" ]] || { echo "Missing canonical directory $path"; exit 1; }
            [[ -w "$path" ]] || { echo "Directory is not writable: $path"; exit 1; }
          done
          [[ "$backend" != "$repository" && "$frontend" != "$backend" && "$frontend" != "$repository" ]] \
            || { echo "Frontend, backend and repository paths must differ"; exit 1; }
          [[ -f "$backend/.env" && ! -L "$backend/.env" ]] || { echo "Missing private production environment $backend/.env"; exit 1; }
          [[ ! -f "$frontend/.htaccess" || ! -L "$frontend/.htaccess" ]] || { echo "Routing rules $frontend/.htaccess must not be a symlink"; exit 1; }
          cd "$HOME"
          mkdir -p erp-releases/incoming erp-releases/releases erp-releases/shared
          chmod 700 erp-releases erp-releases/incoming erp-releases/releases erp-releases/shared
          [[ ! -e "erp-releases/releases/$sha" ]] || { echo "Release $sha already exists; immutable releases are never overwritten"; exit 1; }
          command -v rsync >/dev/null && command -v flock >/dev/null
          REMOTE
          # Upload the immutable archive with rsync over SSH (never FTP).
          rsync -a --checksum --timeout=300 -e "$rsync_rsh" release.tar.gz "$target:erp-releases/incoming/$SHA.tar.gz"
          printf -v remote_deploy 'bash -s -- %q %q %q %q %q %q %q' \
            "$SHA" "$digest" "$APPROVED_SCHEMA_SHA" "${APPROVE_EMPTY_INSTALL:-false}" \
            "$PRODUCTION_FRONTEND_PATH" "$PRODUCTION_BACKEND_PATH" "$PRODUCTION_REPOSITORY_PATH"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "$remote_deploy" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          digest="$2"
          approved="$3"
          empty_install="${4:-false}"
          frontend="$5"
          backend="$6"
          repository="$7"
          export PRODUCTION_FRONTEND_PATH="$frontend"
          export PRODUCTION_BACKEND_PATH="$backend"
          export PRODUCTION_REPOSITORY_PATH="$repository"
          cd "$HOME"
          archive="erp-releases/incoming/$sha.tar.gz"
          echo "$digest  $archive" | sha256sum -c -
          mkdir "erp-releases/releases/$sha"
          tar -xzf "$archive" -C "erp-releases/releases/$sha"
          rm -f "$archive"
          cd "erp-releases/releases/$sha"
          PRODUCTION_DEPLOY_ENABLED=true APPROVED_SCHEMA_SHA="$approved" APPROVE_EMPTY_INSTALL="$empty_install" \
            bash scripts/deploy-production.sh "$sha"
          REMOTE
      - name: Verify the live release over HTTPS
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && success()
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          PUBLIC_URL: ${{ vars.PRODUCTION_PUBLIC_URL || 'https://crm.nakshatech.com' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker=""
          api=""
          for attempt in $(seq 1 20); do
            marker="$(curl -fsS --max-time 20 "$PUBLIC_URL/release-version.json" 2>/dev/null | tr -d '[:space:]' || true)"
            api="$(curl -fsS --max-time 20 "$PUBLIC_URL/api/health" 2>/dev/null || true)"
            if [[ "$marker" == "{\"commit\":\"$SHA\"}" ]] && grep -q '"healthy"' <<<"$api"; then
              echo "Live release $SHA verified at $PUBLIC_URL"
              exit 0
            fi
            echo "Attempt $attempt: marker=${marker:-none}"
            sleep 15
          done
          echo "Live verification failed: $PUBLIC_URL did not serve release $SHA"
          exit 1
      - name: Report deployment health
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && success()
        run: echo "Release ${{ needs.prepare.outputs.sha }} verified in crm_backend and public_html at https://crm.nakshatech.com"
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''
    runs-on: ubuntu-latest
    environment: PRODUCTION
    steps:
      - name: Disabled gate
        if: vars.PRODUCTION_DEPLOY_ENABLED != 'true'
        run: echo "Production rollback disabled by PRODUCTION_DEPLOY_ENABLED."
      - name: Validate rollback inputs
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          SHA: ${{ inputs.rollback_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_sha must be a 40-character commit SHA"; exit 1; }
      - name: Roll the application back natively
        if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          SHA: ${{ inputs.rollback_sha }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          PRODUCTION_FRONTEND_PATH: ${{ vars.PRODUCTION_FRONTEND_PATH || '/home/crmnakshatech/public_html' }}
          PRODUCTION_BACKEND_PATH: ${{ vars.PRODUCTION_BACKEND_PATH || '/home/crmnakshatech/crm_backend' }}
          PRODUCTION_REPOSITORY_PATH: ${{ vars.PRODUCTION_REPOSITORY_PATH || '/home/crmnakshatech/repositories/nakshatech-asset-management-system' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$CPANEL_SSH_PORT")
          printf -v remote_rollback 'bash -s -- %q %q %q %q' \
            "$SHA" "$PRODUCTION_FRONTEND_PATH" "$PRODUCTION_BACKEND_PATH" "$PRODUCTION_REPOSITORY_PATH"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$CPANEL_USERNAME@$CPANEL_HOST" "$remote_rollback" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          frontend="$2"
          backend="$3"
          repository="$4"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOME" == "/home/crmnakshatech" ]]
          export PRODUCTION_FRONTEND_PATH="$frontend"
          export PRODUCTION_BACKEND_PATH="$backend"
          export PRODUCTION_REPOSITORY_PATH="$repository"
          cd "$HOME"
          [[ -f "erp-releases/releases/$sha/RELEASE_SHA" ]] || { echo "Release $sha is not present on the server"; exit 1; }
          PRODUCTION_DEPLOY_ENABLED=true ROLLBACK_SCHEMA_COMPATIBLE_SHA="$sha" \
            bash "erp-releases/releases/$sha/scripts/rollback-production.sh" "$sha"
          REMOTE
