name: nakshatech_asset_management_local_master

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      ENVIRONMENT: development
      API_PREFIX: /api
      ROOT_PATH: ""
      DOCS_ENABLED: "true"
      ENABLE_BACKGROUND_WATCHER: "true"
      SEED_DEFAULT_USERS: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: 480
      CORS_ORIGINS: http://localhost:3100,http://localhost:8088
      TRUSTED_HOSTS: localhost,127.0.0.1,backend
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ORGANIZATION_ADMIN_NAME: ${SEED_ORGANIZATION_ADMIN_NAME:-NakshaTech Administrator}
      SEED_ORGANIZATION_ADMIN_EMAIL: ${SEED_ORGANIZATION_ADMIN_EMAIL:-}
      SEED_ORGANIZATION_ADMIN_PASSWORD: ${SEED_ORGANIZATION_ADMIN_PASSWORD:-}
      SEED_MANAGEMENT_EMAIL: ${SEED_MANAGEMENT_EMAIL}
      SEED_MANAGEMENT_PASSWORD: ${SEED_MANAGEMENT_PASSWORD}
      SEED_IT_EMAIL: ${SEED_IT_EMAIL}
      SEED_IT_PASSWORD: ${SEED_IT_PASSWORD}
      SEED_DRONE_EMAIL: ${SEED_DRONE_EMAIL}
      SEED_DRONE_PASSWORD: ${SEED_DRONE_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: asset-files
      REDIS_URL: redis://redis:6379/0
      BACKUP_ROOT: /backups
      BACKUP_TIMEZONE: Asia/Kolkata
      BACKUP_DATABASE_ENABLED: "true"
      BACKUP_MINIO_ENABLED: "false"
      BACKUP_DAILY_RETENTION_DAYS: 90
      BACKUP_DATABASE_RETENTION_DAYS: 30
      BACKUP_COMMAND_TIMEOUT_SECONDS: 1800
      PG_DUMP_BIN: pg_dump
      LOCAL_BACKUP_AGENT_ENABLED: "false"
      LOCAL_BACKUP_AGENT_TOKEN: ${LOCAL_BACKUP_AGENT_TOKEN}
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app
      - ./local-backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    ports:
      - "3100:3100"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0 --port 3100

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  node_modules:
